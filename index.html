<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moo Virus</title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            background: black; 
            height: 100vh; 
            overflow: hidden; 
            position: relative;
            touch-action: none;
        }
        #cow {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Имитация касаний — белые круги */
        .touch-circle {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            border: 3px solid white;
            pointer-events: none;
            z-index: 9999;
            animation: fadeOut 0.6s forwards;
        }
        @keyframes fadeOut {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        /* Полоса прокрутки для имитации скролла */
        #scrollable {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200vh;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="scrollable"></div>
    <img id="cow" src="https://i.imgur.com/6i5l1wP.jpeg" alt="Корова">

    <script>
        // ===== 1. БЛОКИРУЕМ ВЫХОД =====
        window.onbeforeunload = function() { return "Вирус активирован!"; };

        // ===== 2. ПОКАЗЫВАЕМ КОРОВУ =====
        document.getElementById('cow').style.display = 'block';

        // ===== 3. МЫЧАНИЕ =====
        function moo() {
            let msg = new SpeechSynthesisUtterance("Moooooo!");
            msg.rate = 0.7;
            msg.pitch = 0.3;
            msg.volume = 1;
            speechSynthesis.speak(msg);
        }
        setInterval(moo, 2500);
        moo();

        // ===== 4. ВИБРАЦИЯ =====
        setInterval(() => {
            if (navigator.vibrate) navigator.vibrate(300);
        }, 800);

        // ===== 5. МИГАНИЕ ФОНА =====
        setInterval(() => {
            const colors = ['red', 'lime', 'blue', 'yellow', 'magenta', 'orange'];
            document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }, 400);

        // ===== 6. ИМИТАЦИЯ НАЖАТИЙ (КРУГИ НА ЭКРАНЕ) =====
        function createTouch(x, y) {
            const circle = document.createElement('div');
            circle.className = 'touch-circle';
            circle.style.left = (x - 20) + 'px';
            circle.style.top = (y - 20) + 'px';
            document.body.appendChild(circle);
            setTimeout(() => circle.remove(), 700);
        }

        // Случайные касания каждые 0.4–1.2 секунды
        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            createTouch(x, y);
        }, 600);

        // ===== 7. ИМИТАЦИЯ СКРОЛЛА (листание) =====
        let scrollDirection = 1;
        setInterval(() => {
            const currentScroll = window.scrollY || document.documentElement.scrollTop;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            
            if (currentScroll >= maxScroll) scrollDirection = -1;
            if (currentScroll <= 0) scrollDirection = 1;
            
            window.scrollBy({ top: 30 * scrollDirection, behavior: 'smooth' });
        }, 500);

        // ===== 8. ДОП. ЭФФЕКТ: "КЛИК" В ЦЕНТРЕ ЭКРАНА ПРИ ЗАГРУЗКЕ =====
        setTimeout(() => {
            createTouch(window.innerWidth/2, window.innerHeight/2);
        }, 300);

        // ===== 9. МАСШТАБИРОВАНИЕ (зим/зум) =====
        let zoom = 1;
        setInterval(() => {
            zoom = zoom === 1 ? 1.2 : 1;
            document.body.style.transform = `scale(${zoom})`;
            document.body.style.transformOrigin = 'center center';
        }, 2000);

        console.log('🐮 Moo Virus activated! (Прикол)');
    </script>
</body>
</html>
